# ======================================================
# SERVER
# ======================================================
server.port=8083

# ======================================================
# APPLICATION
# ======================================================
spring.application.name=notification-service

# ======================================================
# DATASOURCE
# ======================================================
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notificationdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=NotificationHikariPool

# ======================================================
# JPA / HIBERNATE
# ======================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ======================================================
# EUREKA
# ======================================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ======================================================
# MAIL (Gmail SMTP)
# ======================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:pinanktrivedi694@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:epizuqyuimbzmzac}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender display name
notification.mail.from-name=Subscription Platform
notification.mail.from-address=${SPRING_MAIL_FROM_ADDRESS:${spring.mail.username}}

# ======================================================
# THYMELEAF (email templates only — no view resolution)
# ======================================================
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ======================================================
# SCHEDULER
# ======================================================
notification.scheduler.enabled=true
notification.scheduler.cron=0 0 */6 * * *
notification.renewal.days-before=7
notification.retry.max-attempts=3

# ======================================================
# FEIGN
# ======================================================
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000

# ======================================================
# ACTUATOR
# ======================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ======================================================
# SPRINGDOC / SWAGGER
# ======================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ======================================================
# LOGGING
# ======================================================
logging.level.root=INFO
logging.level.com.subscription.notification=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/notification-service.log

# ======================================================
# SERVER
# ======================================================
server.port=8080

# ======================================================
# APPLICATION
# ======================================================
spring.application.name=api-gateway

# ======================================================
# SPRING CLOUD GATEWAY — Discovery Locator
# ======================================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Dedup CORS headers added by both gateway and downstream services
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# ======================================================
# ROUTES
# ======================================================

# AUTH SERVICE (Public)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0].name=CorrelationIdFilter

# SUBSCRIPTION SERVICE (Protected)
spring.cloud.gateway.routes[1].id=subscription-service
spring.cloud.gateway.routes[1].uri=lb://SUBSCRIPTION-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/subscriptions/**
spring.cloud.gateway.routes[1].filters[0].name=CorrelationIdFilter

# BILLING SERVICE (Protected)
spring.cloud.gateway.routes[2].id=billing-service
spring.cloud.gateway.routes[2].uri=lb://BILLING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/billing/**
spring.cloud.gateway.routes[2].filters[0].name=CorrelationIdFilter

# NOTIFICATION SERVICE (Protected)
spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[3].filters[0].name=CorrelationIdFilter

# AI AGENT SERVICE (FastAPI Multi-Agent Service)
spring.cloud.gateway.routes[4].id=ai-agent-service
spring.cloud.gateway.routes[4].uri=${AI_AGENT_SERVICE_URL:http://localhost:8000}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/ai/**
spring.cloud.gateway.routes[4].filters[0].name=CorrelationIdFilter

# ======================================================
# EUREKA
# ======================================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ======================================================
# JWT
# ======================================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ======================================================
# ACTUATOR
# ======================================================
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# ======================================================
# LOGGING
# ======================================================
logging.level.root=INFO
logging.level.com.subscription.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/api-gateway.log
